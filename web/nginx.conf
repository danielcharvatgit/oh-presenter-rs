# oh! Presenter web behind nginx: copy dist/ to /srv/oh-presenter-web. The Axum server
# (server/) is optional: only /api/ goes to it.
server {
    listen 80;
    server_name _;
    root /srv/oh-presenter-web;
    index index.html;

    # .wasm must be application/wasm: in /etc/nginx/mime.types since nginx 1.21; older ones
    # need "application/wasm wasm;" added there

    # the service worker and the page are checked for a new build on every visit
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

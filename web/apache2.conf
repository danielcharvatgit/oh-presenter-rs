# oh! Presenter web behind Apache 2: copy dist/ to /srv/oh-presenter-web.
# a2enmod headers proxy proxy_http (proxy only for the optional Axum server under /api/)
<VirtualHost *:80>
    DocumentRoot /srv/oh-presenter-web
    DirectoryIndex index.html

    <Directory /srv/oh-presenter-web>
        Require all granted
        FallbackResource /index.html
    </Directory>

    AddType application/wasm .wasm

    # the service worker and the page are checked for a new build on every visit
    <FilesMatch "^(sw\.js|index\.html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
</VirtualHost>
